[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
description = "What the Sheets, Docs and Slides apps share: the black look, the title bar, toolbar icons, file dialogs and the Claude panel with the MCP bridge its document tools go through"
license = "MIT"
repository = "https://github.com/GoldenSheeeep/atelier"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "pollster"] }
